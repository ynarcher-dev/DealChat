<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/dealchat-favicon.png">
    <title>My Sellers - DealChat</title>
    <!-- Bootstrap CSS - Moved up to let style.css override it -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/url_helper.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" integrity="sha384-uGEvnSEpW2nM9xJFsrxrwakwrk9QdDTQIBJh0hVMu90OaVyMAMpAK1rIn0/Kh1/k" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script src="../js/profile_modal.js" type="module"></script>
</head>

<body class="theme-mode-sellers" data-share-entity="매도자 정보">
    <!-- Global Loading Overlay -->
    <div id="global-loader">
        <div class="loader-logo">DealChat</div>
        <div class="loader-text"></div>
    </div>

    <!-- Transition Loader for Detail View -->
    <div id="transition-loader">
        <div class="spinner"></div>
        <div class="loader-text"></div>
    </div>

    <div class="app-container">

        <main class="main-content dashboard-bg">
            <header id="global-header" class="top-bar"></header>

            <section class="page-content">

                <div class="text-center mb-4">
                    <h1 class="page-title">My Sellers</h1>
                    <p class="page-subtitle">내가 담당하는 매도자 정보를 관리하세요.</p>
                </div>

                <div class="search-and-actions">

                    <!-- Centered Search Bar -->
                    <div class="search-centered-wrap">
                        <div class="input-wrapper">
                            <input type="text" id="search-input" placeholder="매도자명, ID 또는 키워드로 검색해주세요">
                            <button id="search-icon-btn">
                                <span class="material-symbols-outlined">search</span>
                            </button>
                        </div>
                    </div>

                    <!-- Right: Action Icons -->
                    <div class="actions-right">

                        <!-- CSV Download Icon Button -->
                        <button id="export-csv-btn" class="btn-icon-round" title="CSV 다운로드">
                            <span class="material-symbols-outlined">download</span>
                        </button>
                        <!-- Add Seller Icon Button -->
                        <button id="new-btn" class="btn-icon-round primary" title="매도자 등록">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                    </div>
                </div>

                <!-- Collapsible Filter Container -->
                <div id="filter-container" class="filter-panel">
                    <!-- Industry Filter -->
                    <div class="filter-group mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <label class="filter-group-label">산업분야</label>
                            <button id="reset-filters" class="btn-filter-reset">선택 해제</button>
                        </div>
                        <div id="filter-industry-list" class="d-flex flex-wrap gap-2">
                            <!-- Industry checkboxes will be injected here -->
                        </div>
                    </div>

                    <!-- Row for Status and Visibility -->
                    <div class="row">
                        <!-- Status Filter -->
                        <div class="col-md-4">
                            <div class="filter-group mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <label class="filter-group-label">진행 현황</label>
                                </div>
                                <div id="filter-method-list" class="d-flex flex-wrap gap-2">
                                    <div class="filter-item">
                                        <input type="checkbox" class="btn-check method-checkbox" id="filter-method-대기" value="대기" autocomplete="off">
                                        <label class="industry-checkbox-label" for="filter-method-대기">대기</label>
                                    </div>
                                    <div class="filter-item">
                                        <input type="checkbox" class="btn-check method-checkbox" id="filter-method-진행중" value="진행중" autocomplete="off">
                                        <label class="industry-checkbox-label" for="filter-method-진행중">진행중</label>
                                    </div>
                                    <div class="filter-item">
                                        <input type="checkbox" class="btn-check method-checkbox" id="filter-method-완료" value="완료" autocomplete="off">
                                        <label class="industry-checkbox-label" for="filter-method-완료">완료</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Visibility Filter -->
                        <div class="col-md-4">
                            <div class="filter-group mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <label class="filter-group-label">공개 여부</label>
                                </div>
                                <div id="filter-visibility-list" class="d-flex flex-wrap gap-2">
                                    <div class="filter-item">
                                        <input type="checkbox" class="btn-check visibility-checkbox" id="filter-vis-public" value="public" autocomplete="off">
                                        <label class="industry-checkbox-label" for="filter-vis-public">공개</label>
                                    </div>
                                    <div class="filter-item">
                                        <input type="checkbox" class="btn-check visibility-checkbox" id="filter-vis-private" value="private" autocomplete="off">
                                        <label class="industry-checkbox-label" for="filter-vis-private">비공개</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Price & Revenue Range Filters -->
                    <div class="row align-items-end">
                        <div class="col-md-4">
                            <label class="filter-range-label">희망가 범위 (억)</label>
                            <div class="d-flex align-items-center gap-2">
                                <input type="number" id="filter-min-price" class="form-control filter-range-input" placeholder="최소" style="width: 120px;">
                                <span class="text-muted">~</span>
                                <input type="number" id="filter-max-price" class="form-control filter-range-input" placeholder="최대" style="width: 120px;">
                                
                                <div class="filter-item ms-2 mb-0" style="margin: 0 !important;">
                                    <input type="checkbox" class="btn-check negotiable-checkbox" id="filter-negotiable" value="협의" autocomplete="off">
                                    <label class="industry-checkbox-label d-flex align-items-center gap-1 mb-0" for="filter-negotiable"
                                        style="padding: 10px 15px; height: 42px; white-space: nowrap;">
                                        <span class="material-symbols-outlined" style="font-size: 16px;">handshake</span>
                                        협의 포함
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <label class="filter-range-label">매출 규모 (억)</label>
                            <div class="d-flex flex-nowrap gap-2">
                                <div class="filter-item"><input type="checkbox" class="btn-check revenue-checkbox" id="rev-5-my" value="5 미만" autocomplete="off"><label class="industry-checkbox-label" for="rev-5-my" style="white-space:nowrap;padding:10px 10px;">5 미만</label></div>
                                <div class="filter-item"><input type="checkbox" class="btn-check revenue-checkbox" id="rev-10-my" value="5~10" autocomplete="off"><label class="industry-checkbox-label" for="rev-10-my" style="white-space:nowrap;padding:10px 10px;">5~10</label></div>
                                <div class="filter-item"><input type="checkbox" class="btn-check revenue-checkbox" id="rev-30-my" value="10~30" autocomplete="off"><label class="industry-checkbox-label" for="rev-30-my" style="white-space:nowrap;padding:10px 10px;">10~30</label></div>
                                <div class="filter-item"><input type="checkbox" class="btn-check revenue-checkbox" id="rev-50-my" value="30~50" autocomplete="off"><label class="industry-checkbox-label" for="rev-50-my" style="white-space:nowrap;padding:10px 10px;">30~50</label></div>
                                <div class="filter-item"><input type="checkbox" class="btn-check revenue-checkbox" id="rev-100-my" value="50~100" autocomplete="off"><label class="industry-checkbox-label" for="rev-100-my" style="white-space:nowrap;padding:10px 10px;">50~100</label></div>
                                <div class="filter-item"><input type="checkbox" class="btn-check revenue-checkbox" id="rev-300-my" value="100~300" autocomplete="off"><label class="industry-checkbox-label" for="rev-300-my" style="white-space:nowrap;padding:10px 10px;">100~300</label></div>
                                <div class="filter-item"><input type="checkbox" class="btn-check revenue-checkbox" id="rev-500-my" value="300~500" autocomplete="off"><label class="industry-checkbox-label" for="rev-500-my" style="white-space:nowrap;padding:10px 10px;">300~500</label></div>
                                <div class="filter-item"><input type="checkbox" class="btn-check revenue-checkbox" id="rev-1000-my" value="500~1,000" autocomplete="off"><label class="industry-checkbox-label" for="rev-1000-my" style="white-space:nowrap;padding:10px 8px;">500~1,000</label></div>
                                <div class="filter-item"><input type="checkbox" class="btn-check revenue-checkbox" id="rev-max-my" value="1,000 이상" autocomplete="off"><label class="industry-checkbox-label" for="rev-max-my" style="white-space:nowrap;padding:10px 8px;">1,000 이상</label></div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Table Header Section: Title & Sort -->
                <div class="d-flex justify-content-between align-items-end mb-3 px-1">
                    <div class="list-section-title">
                        매도자 목록
                    </div>
                    <div class="dropdown">
                        <button
                            class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center justify-content-between p-2 sort-dropdown-btn"
                            type="button" id="sort-dropdown-btn" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="d-flex align-items-center gap-2">
                                <span class="material-symbols-outlined">sort</span>
                                <span id="current-sort-label">최근 등록순</span>
                            </div>
                            <span class="material-symbols-outlined">expand_more</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg p-2 mt-2"
                            aria-labelledby="sort-dropdown-btn"
                            style="border-radius: 12px; min-width: 180px;">
                            <li><a class="dropdown-item rounded-3 py-2 sort-option active" href="#" data-sort="latest">최근 등록순</a></li>
                            <li><a class="dropdown-item rounded-3 py-2 sort-option" href="#" data-sort="oldest">오래된 등록순</a></li>
                            <li class="dropdown-divider my-1"></li>
                            <li><a class="dropdown-item rounded-3 py-2 sort-option" href="#" data-sort="name_asc">이름순 (ㄱ-ㅎ)</a></li>
                            <li><a class="dropdown-item rounded-3 py-2 sort-option" href="#" data-sort="name_desc">이름순 (ㅎ-ㄱ)</a></li>
                            <li class="dropdown-divider my-1"></li>
                            <li><a class="dropdown-item rounded-3 py-2 sort-option" href="#" data-sort="price_desc">희망가 높은순</a></li>
                            <li><a class="dropdown-item rounded-3 py-2 sort-option" href="#" data-sort="price_asc">희망가 낮은순</a></li>
                        </ul>
                    </div>
                </div>

                <!-- Sellers Table Container -->
                <div id="seller-list-wrap" class="list-table-wrap">
                    <div class="table-responsive">
                        <table class="table table-hover m-0" style="table-layout: fixed; vertical-align: middle;">
                            <thead>
                                <tr>
                                    <th class="list-th" style="width: 220px;">매도자명</th>
                                    <th class="list-th" style="width: 140px;">산업</th>
                                    <th class="list-th" style="width: 90px;">희망가 (억)</th>
                                    <th class="list-th" style="width: 110px;">매출규모 (억)</th>
                                    <th class="list-th" style="width: 100px;">진행 현황</th>
                                    <th class="list-th" style="width: 240px;">비공개 메모 (작성자만 확인 가능)</th>
                                    <th class="list-th" style="width: 150px;">담당자</th>
                                    <th class="list-th" style="width: 110px;">등록/수정</th>
                                    <th class="list-th" style="width: 70px;">공유</th>
                                </tr>
                            </thead>
                            <tbody id="seller-list-container">
                                <!-- Table rows will be injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="pagination-container" class="d-flex justify-content-center mt-5"
                    style="gap: 8px;">
                    <!-- Pagination buttons will be injected here -->
                </div>
            </section>
            <footer id="global-footer"></footer>
        </main>
    </div>




    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.103.0" integrity="sha384-PsnFqJ58vyp7buRfuvdS2SrjRdUYinBv6lWwJXx3xQ17hWefo/UkwXowVBT53ubG" crossorigin="anonymous"></script>
    <script src="../js/front-config.js"></script>
    <script src="../js/header_loader.js"></script>
    <script src="../js/footer_loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="../js/modal_loader.js"></script>
    <script src="../js/my_sellers.js?v=20260514_02" type="module"></script>
</body>


</html>
